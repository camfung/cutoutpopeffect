# Static single-page app served by nginx. The compose project (directory)
# name namespaces the service, matching the CamAppEngine convention.
# REMOVEBG_AUTH (base64 user:pass for the removebg proxy) comes from the
# deploy secrets .env copied next to this file by CamAppEngine.
services:
  cutoutpopeffect:
    build: .
    ports:
      - "${PORT:-8779}:80"
    environment:
      REMOVEBG_AUTH: "${REMOVEBG_AUTH:-}"
    restart: unless-stopped
